<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Tunebox</title>
  </head>
  <body class="app">
    <div id="studio-backdrop" aria-hidden="true"></div>
    <div class="backdrop-vignette" aria-hidden="true"></div>
    <div class="ps2-scanlines" aria-hidden="true"></div>

    <main class="content">
      <section class="menu-card">
      <div class="note-hero" aria-hidden="true">
        <svg class="cel-note" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="note-shade-a" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffe566" />
              <stop offset="55%" stop-color="#ffb830" />
              <stop offset="100%" stop-color="#e87818" />
            </linearGradient>
            <linearGradient id="note-shade-b" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffd850" />
              <stop offset="100%" stop-color="#c86010" />
            </linearGradient>
            <linearGradient id="note-shade-c" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffec90" />
              <stop offset="100%" stop-color="#ff9830" />
            </linearGradient>
          </defs>
          <!-- cel-shaded eighth note -->
          <ellipse cx="34" cy="128" rx="26" ry="20" fill="url(#note-shade-b)" stroke="#120818" stroke-width="5" />
          <ellipse cx="30" cy="124" rx="14" ry="8" fill="#fff4a8" opacity="0.55" />
          <rect x="52" y="18" width="16" height="112" rx="4" fill="url(#note-shade-a)" stroke="#120818" stroke-width="5" />
          <rect x="56" y="22" width="5" height="100" fill="#fff6b0" opacity="0.35" />
          <path
            d="M68 22 C96 22, 108 34, 108 52 C108 70, 92 82, 68 82 L68 22 Z"
            fill="url(#note-shade-c)"
            stroke="#120818"
            stroke-width="5"
            stroke-linejoin="round"
          />
          <path d="M74 30 C92 32, 98 40, 98 52 C98 62, 90 70, 74 72 Z" fill="#fff8c8" opacity="0.42" />
        </svg>
      </div>

      <h1 class="title">Tunebox</h1>

      <p class="tagline">
        Hey Mozart! Ready to give it a shot? Spin your tune!
      </p>

      <button class="start-button" id="start-button">
        <span class="start-cursor">▶</span>
        <span class="start-label">Spin your tune</span>
      </button>

      <div class="round-line">
        <span id="daily-track">Today’s Round</span>
        <span id="daily-sub">Resets at 00:00 (GMT+2)</span>
      </div>
      </section>
    </main>

    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
